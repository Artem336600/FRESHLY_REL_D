<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshly - Анализ продуктов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-apple me-2"></i>
                Freshly
            </a>
        </div>
    </nav>
    
    <div class="container main-container">
        <div class="row justify-content-center mb-4">
            <div class="col-lg-8">
                <div class="search-container text-center">
                    <h1 class="display-5 fw-bold">Найдите продукты по теме</h1>
                    <p class="lead mb-4">Введите любую тему, связанную с едой или культурой, и мы найдем для вас подходящие продукты</p>
                    <form id="dataForm" class="d-flex justify-content-center">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control search-input" id="inputData" placeholder="Например: Завтрак, Япония, Лето...">
                            <button class="btn btn-primary search-btn" type="submit">
                                <i class="bi bi-search me-2"></i>Найти
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div id="resultsContainer" class="results-container">
            <!-- Здесь будут результаты -->
            <div class="text-center mt-5 initial-message">
                <i class="bi bi-arrow-up-circle display-1 text-muted"></i>
                <p class="mt-3 text-muted">Введите тему выше, чтобы получить результаты</p>
            </div>
        </div>
    </div>
    
    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span class="text-muted">© 2024 Freshly. Все права защищены.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
